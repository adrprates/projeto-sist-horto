# ==========================================================
# Perfil "test": banco H2 em memória (modo MySQL), recriado a
# cada execução. Não é necessário ter o MySQL rodando.
# ==========================================================
spring.datasource.url=jdbc:h2:mem:horto_teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database=h2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Segredo e validade do JWT usados apenas nos testes
app.jwt.secret=segredo-exclusivo-dos-testes-automatizados
app.jwt.expiration=3600000

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off

# O H2 em memória começa vazio: o Hibernate tenta remover chaves estrangeiras de
# tabelas que ainda não existem antes de criá-las. É inofensivo, então não é logado.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=error
